name: Build and deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build real Astro static site
        run: npm run build
      - name: Verify indexing policy and assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/robots.txt
          grep -q 'name="robots"' dist/index.html
          grep -q 'noindex' dist/index.html
          for asset in zebrabyte-black.svg zebrabyte-white.svg favicon.svg vercara.webp cloudflare.webp insecureweb.webp 20i.svg newfold.svg zb-partner.webp; do
            test -s "dist/assets/$asset"
          done
          test ! -f dist/sitemap.xml
          printf 'www.zbt.network\n' > dist/CNAME
          touch dist/.nojekyll
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
